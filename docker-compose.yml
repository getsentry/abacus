services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: abacus
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Local Neon proxy: the app talks to Postgres through Neon's serverless driver
  # (@vercel/postgres / @neondatabase/serverless), which speaks Neon's WebSocket +
  # HTTP "/sql" protocol rather than plain TCP. This proxy serves both against the
  # local Postgres so the app runs fully offline. See src/lib/neon-local.ts.
  neon_proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    environment:
      PG_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/abacus
    ports:
      - "4444:4444"
    depends_on:
      - postgres

volumes:
  postgres_data:
